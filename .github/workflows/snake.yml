name: Generate Snake Animation

on:
  schedule:
    - cron: '00 00,12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Light & Dark Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-light.svg?color_snake=#2ea043&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3fb950&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish Animations
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: snake-output
          build_dir: ./dist
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: 'Refresh Contribution Snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
